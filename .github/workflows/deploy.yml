name: Deploy Panel WebAssembly Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-Stage Data Provenance & WebAssembly Datasets
        run: |
          PYTHONPATH=. python stage_provenance.py

      - name: Convert Panel Dashboard to WebAssembly (Ultra-Fast Pyodide Engine)
        run: |
          mkdir -p dist
          PYTHONPATH=. panel convert bubble_detector/ui/panel_dashboard.py --to pyodide --requirements panel bokeh plotly numpy --out dist/
          mv dist/panel_dashboard.html dist/index.html
          cp data/provenance/*.parquet dist/ 2>/dev/null || true
          cp data/provenance/*.json dist/ 2>/dev/null || true
          python -c "
          with open('dist/index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          import re
          content = re.sub(r'\'https://cdn\.holoviz\.org/panel/wheels/bokeh-[^\']+\.whl\'', '\'bokeh\'', content)
          content = re.sub(r'\'https://cdn\.holoviz\.org/panel/[^\']+/panel-[^\']+\.whl\'', '\'panel\'', content)
          # Generic regex decoding for any \\U0001xxxx or U0001xxxx escape sequences
          content = re.sub(r'\\+U0001([0-9a-fA-F]{4})', lambda m: chr(int('0001' + m.group(1), 16)), content)
          content = re.sub(r'U0001([0-9a-fA-F]{4})', lambda m: chr(int('0001' + m.group(1), 16)), content)
          # Explicit literal replacements for all application emojis
          replacements = {
              'U0001f3db': '🏛️',
              '\\U0001f3db': '🏛️',
              'U0001f3af': '🎯',
              '\\U0001f3af': '🎯',
              'U0001f52c': '🔬',
              '\\U0001f52c': '🔬',
              'U0001f4c5': '📅',
              '\\U0001f4c5': '📅',
              'U0001f4c9': '📉',
              '\\U0001f4c9': '📉',
              'U0001f680': '🚀',
              '\\U0001f680': '🚀',
              'U0001f319': '🌙',
              '\\U0001f319': '🌙',
              'U0001f917': '🤗',
              '\\U0001f917': '🤗',
          }
          for k, v in replacements.items():
              content = content.replace(k, v)

          preloader_and_error_boundary = '''
      for (const ds of ['market_data_50yr.json', 'market_data_modern.json']) {
        try {
          let r = await fetch(ds);
          if (r.ok) {
            let t = await r.text();
            pyodide.FS.writeFile(ds, t);
            console.log('Pre-loaded MEMFS dataset: ' + ds);
          }
        } catch(e) { console.warn('Could not pre-load ' + ds, e); }
      }
      try {
        await pyodide.runPythonAsync(code);
      } catch (err) {
        document.body.classList.remove('pn-loading');
        let el = document.createElement('div');
        el.style.cssText = 'margin: 2rem; padding: 1.5rem; background: #2A1515; border: 1px solid #FF5252; color: #FFF; border-radius: 8px; font-family: monospace; white-space: pre-wrap;';
        el.innerHTML = '<h3>⚠️ WebAssembly Initialization Error</h3><p>' + err + '</p>';
        document.body.prepend(el);
      }'''

          if 'WebAssembly Initialization Error' not in content:
              content = re.sub(r'await\s+pyodide\.runPythonAsync\(code\);?', preloader_and_error_boundary, content)

          with open('dist/index.html', 'w', encoding='utf-8') as f:
              f.write(content)
          "




      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
