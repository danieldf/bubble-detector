name: Deploy Panel WebAssembly Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-Stage Data Provenance & WebAssembly Datasets
        run: |
          PYTHONPATH=. python stage_provenance.py

      - name: Convert Panel Dashboard to WebAssembly (Ultra-Fast Pyodide Engine)
        run: |
          mkdir -p dist
          WASM_BUILD_PACKAGING=1 PYTHONPATH=. panel convert bubble_detector/ui/panel_dashboard.py --to pyodide --requirements panel bokeh plotly numpy --out dist/
          mv dist/panel_dashboard.html dist/index.html
          cp data/provenance/*.parquet dist/ 2>/dev/null || true
          cp data/provenance/*.json dist/ 2>/dev/null || true
          cp sw.js dist/ 2>/dev/null || true
          python bubble_detector/ui/postprocess_wasm.py





      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
