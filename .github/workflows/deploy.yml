name: Deploy Panel WebAssembly Dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install panel bokeh polars plotly scikit-learn numpy yfinance

      - name: Convert Panel Dashboard to WebAssembly (Pyodide Worker)
        run: |
          mkdir -p dist
          PYTHONPATH=. panel convert bubble_detector/ui/panel_dashboard.py --to pyodide-worker --requirements panel bokeh plotly polars scikit-learn numpy --out dist/
          mv dist/panel_dashboard.html dist/index.html


      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
